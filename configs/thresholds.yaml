unified:
  severity_weights:
    high: 1.0
    medium: 0.6
    low: 0.3
  note: 'No unified-score threshold: the decision is the OR of the schema, semantic
    and per-column statistical channel gates (see detectors/unified.py)'
semantic:
  range_tolerance_fraction: 0.01
schema:
  binary: true
  threshold_required: false
  severity_labels:
    added: high
    removed: high
    renamed: high
    type_change: medium
    nullability_change: low
  severity_rationale: 'Structural breaks (added / removed / renamed columns) are HIGH:
    they change the record shape and break downstream consumers. Type changes are
    MEDIUM: values are reinterpreted but the record shape is unchanged. Nullability
    changes are LOW: metadata-level, values themselves are unchanged.

    '
window:
  size: 1000
  sweep_deferred: true
reference:
  mode: rolling
  min_rows_per_device: 30
  rolling_history: 1
  reference_region:
