# ============================================================
# DERIVED CONFIG - Revision thresholds v3
# ============================================================
# Derived ONLY from clean calibration data OUTSIDE the evaluation
# regions, by:
#     PYTHONPATH=. python3 experiments/derive_thresholds.py --calibration-mode multi_block --quantile 0.999 --pooling gas_envelope --blocks "101000-110000;250000-265000;270000-285000;290000-303000;325000-340000;355000-370000" --group-enabled --persistence-k 2 --persistence-n 3 --output-root results\revision3
#
# Protocol (Revision v3): every choice was made on calibration and
# validation regions ONLY (see
# results/revision/validation_fpr_options/selection.json); the
# evaluation regions (matrix [0, 100000), lag [120000, 250000)) were
# never used for any threshold or switch choice, and the evaluation
# ladder was run exactly once afterwards.
#
# Split (all row regions are disjoint):
#   reference sample   rows [250000, 325000]
#   calibration        6 disjoint blocks outside the evaluation regions (101000-110000, 250000-265000, 270000-285000, 290000-303000, 325000-340000, 355000-370000) (threshold derivation)
#   clean holdout      rows [385000, 405184] (out-of-sample FPR report)
#   evaluation         rows [0, 100000) matrix + [120000, 250000) lag
#                      (drift_injection/phase7_generator.py) - NEVER
#                      used for calibration or selection
#
# Reference mode: rolling
# Calibration seed: 1234567 (NOT one of the ten evaluation seeds)
# Derivation: per-column effect threshold = 99.9% percentile of
# the clean effect-size distribution, gas columns = max over per-block quantiles, other columns = one-region quantile.
# Gas-group (option a, ANSWERS the per-column triggers): ONE test for the collinear gas
# columns (max member effect vs ONE calibrated group threshold).
# Persistence (option b, disabled): alarm only if the statistical
# trigger fired in k of the last n windows.
#
# A gate fires when its p-value passes Benjamini-Hochberg correction
# (alpha=0.01) AND its effect reaches its calibrated threshold.
#
# Previous values: Revision v2 in results/revision/, frozen v1 in
# configs/thresholds_v1_frozen.yaml.
# Full derivation audit: results\revision3\threshold_derivation.json
# ============================================================
statistical:
  alpha: 0.01
  correction: benjamini-hochberg
  psi_bins: 10
  decision_threshold: 1.0
  default_effect_threshold: 0.509893
  default_categorical_effect_threshold: 0.02
  column_effect_thresholds:
    co: 0.501678
    humidity: 0.229827
    light: 0.338642
    lpg: 0.509893
    motion: 0.109343
    smoke: 0.508372
    temp: 0.177239
    device: 0.02
  categorical_p_value_threshold: 0.05
  gas_group:
    enabled: true
    columns:
    - co
    - lpg
    - smoke
    aggregation: max
    threshold: 0.509893
    note: 'option (a): co/lpg/smoke are one collinear gas sensor; the group statistic
      is the max member effect and the threshold is calibrated on the clean group-statistic
      distribution (same quantile/pooling as the columns). The group gate replaces
      the three per-column triggers when enabled.'
  persistence:
    enabled: false
    k: 2
    n: 3
    note: 'option (b): alarm only if the statistical trigger fired in k of the last
      n windows; honest added detection lag is (k - 1) windows'
  calibration:
